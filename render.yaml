databases:
  - name: dpg-d0q4e1mmcj7s73enu920-a
    databaseName: sample_sns_project2_2
    user: demo_user
    region: singapore

services:
  - type: web
    name: dpg-d0q4e1mmcj7s73enu920-a
    env: ruby
    region: singapore
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: <%= ENV['DATABASE_URL'] %>
        fromDatabase:
          name: render_app
          property: connectionString
      - key: <%= ENV['RAILS_MASTER_KEY'] %>
        sync: false

  - type: worker
    name: mailer-worker
    env: ruby
    plan: free
    buildCommand: "bundle install"
    startCommand: "bundle exec rails jobs:work"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dpg-d0q4e1mmcj7s73enu920-a
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: GMAIL_USERNAME
        sync: false
      - key: GMAIL_PASSWORD
        sync: false